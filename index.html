<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mạng Thần Kinh AI Chatbot</title>
    <!-- Nhúng thư viện trí tuệ nhân tạo TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 400px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow: hidden; margin-top: 20px; }
        .chat-header { background: #10b981; color: white; padding: 15px; text-align: center; font-weight: bold; }
        .chat-box { height: 300px; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px; border-radius: 8px; max-width: 70%; word-break: break-word; }
        .user { background: #10b981; color: white; align-self: flex-end; }
        .bot { background: #e4e6eb; color: black; align-self: flex-start; }
        .input-area { display: flex; border-top: 1px solid #ddd; }
        .input-area input { flex: 1; padding: 15px; border: none; outline: none; }
        .input-area button { padding: 15px; background: #10b981; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">Mạng Thần Kinh AI (TensorFlow)</div>
    <div class="chat-box" id="chatBox">
        <div class="message bot">Đang kích hoạt bộ não AI (model.json)... Vui lòng đợi!</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Nhập tin nhắn..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Gửi</button>
    </div>
</div>

<script>
    let model, wordIndex, maxLength, uniqueAnswers;
    const GITHUB_URL = 'https://raw.githubusercontent.com/vo3695941-cmyk/chatbottttttttttt/refs/heads/main/data.csv';

    // Hàm tự động tải bộ não AI về trình duyệt web khi mở trang
    async function initAI() {
        try {
            // 1. Tải dữ liệu từ vựng metadata
            let metaRes = await fetch(GITHUB_URL + 'metadata.json');
            let metadata = await metaRes.json();
            wordIndex = metadata.word_index;
            maxLength = metadata.max_length;
            uniqueAnswers = metadata.unique_answers;

            // 2. Tải và dựng mô hình mạng thần kinh TensorFlow
            model = await tf.loadLayersModel(GITHUB_URL + 'model.json');
            
            document.getElementById("chatBox").innerHTML = `<div class="message bot">Trí tuệ nhân tạo đã khởi động xong! Chat thử với tôi nhé.</div>`;
        } catch (error) {
            console.error(error);
            document.getElementById("chatBox").innerHTML = `<div class="message bot" style="color:red;">Lỗi tải bộ não model.json! Hãy chắc chắn bạn đã up đủ các file vào thư mục ai_model trên GitHub.</div>`;
        }
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") sendMessage();
    }

    // Hàm xử lý phân tích ngôn ngữ bằng AI khi người dùng nhắn tin
    async function sendMessage() {
        let input = document.getElementById("userInput");
        let text = input.value.trim();
        if (!text || !model) return;

        let chatBox = document.getElementById("chatBox");
        chatBox.innerHTML += `<div class="message user">${text}</div>`;
        input.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        // Tiến hành tiền xử lý câu chữ của người dùng thành các chuỗi số giống lúc huấn luyện
        let words = text.toLowerCase().split(" ");
        let sequence = words.map(word => wordIndex[word] || wordIndex["<OOV>"]);
        
        while (sequence.length < maxLength) sequence.push(0);
        if (sequence.length > maxLength) sequence = sequence.slice(0, maxLength);

        // Đưa ma trận số vào cho Mạng thần kinh suy nghĩ và dự đoán kết quả
        const inputTensor = tf.tensor2d([sequence], [1, maxLength]);
        const prediction = model.predict(inputTensor);
        const predictedClassIdx = prediction.argMax(-1).dataSync()[0];
        const probabilities = prediction.dataSync();
        
        let confidence = probabilities[predictedClassIdx]; // Độ tự tin của AI

        setTimeout(() => {
            let reply = "Hệ thống thần kinh chưa hiểu được ý của câu này!";
            // Nếu AI tự tin trên 35%, nó sẽ lấy câu trả lời tối ưu nhất để phản hồi
            if (confidence > 0.35) {
                reply = uniqueAnswers[predictedClassIdx];
            }

            chatBox.innerHTML += `<div class="message bot">${reply}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }, 300);
    }

    // Chạy kích hoạt AI ngay khi tải trang web
    initAI();
</script>

</body>
</html>
